name: External readiness watchdog
on:
  schedule:
    - cron: '3-53/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Availability check or isolated simulated drill
        type: choice
        default: check
        options:
          - check
          - drill-down
          - drill-up
          - drill-cycle
          - backup-drill-cycle
permissions:
  contents: write
concurrency:
  group: external-readiness
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify monitor logic
        run: node --test tests/monitor.test.mjs
      - name: Check readiness and notify on transitions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_REPOSITORY: ${{ vars.MONITOR_REPOSITORY }}
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_URL_SHA256: ${{ secrets.MONITOR_URL_SHA256 }}
          BACKUP_MONITOR_URL: ${{ secrets.BACKUP_MONITOR_URL }}
          BACKUP_MONITOR_URL_SHA256: ${{ secrets.BACKUP_MONITOR_URL_SHA256 }}
          BACKUP_MONITOR_TOKEN: ${{ secrets.BACKUP_MONITOR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
        run: node monitor.mjs
