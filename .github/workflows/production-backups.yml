name: Production backup alerts
on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only health check or isolated simulated alert drill
        type: choice
        default: check
        options: [check, drill, diagnose]
permissions:
  contents: write
concurrency:
  group: production-backup-alerts
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'Fraboli365/tourspay-watchdog'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify isolated production alert logic
        run: node --test production-tests/*.test.mjs
      - name: Observe production backups and notify transitions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_REPOSITORY: Fraboli365/tourspay-watchdog
          PRODUCTION_BACKUP_MONITOR_URL: ${{ secrets.PRODUCTION_BACKUP_MONITOR_URL }}
          PRODUCTION_BACKUP_MONITOR_URL_SHA256: ${{ secrets.PRODUCTION_BACKUP_MONITOR_URL_SHA256 }}
          PRODUCTION_BACKUP_MONITOR_TOKEN: ${{ secrets.PRODUCTION_BACKUP_MONITOR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTION_MONITOR_MODE: ${{ inputs.mode || 'check' }}
        run: node production-backups-monitor.mjs